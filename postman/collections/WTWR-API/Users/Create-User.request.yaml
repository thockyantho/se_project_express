$kind: http-request
name: Create User
method: POST
url: '{{baseUrl}}/users'
order: 3000
description: 'Creates a new user. Requires `name` (2–30 chars) and `avatar` (valid URL).'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe",
      "avatar": "https://example.com/avatar.jpg"
    }
